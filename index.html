<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omoshiroi.loc.cc · 个人服务入口</title>
<meta name="description" content="omoshiroi.loc.cc 个人导航与服务入口">
<style>
  :root{
    --bg:#f5f7fa;
    --card:#ffffff;
    --ink:#1f2733;
    --ink-soft:#6b7686;
    --line:#e3e8ef;
    --accent:#2f6df6;
    --accent-soft:#eaf1ff;
    --shadow:0 1px 3px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.05);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;line-height:1.6;
  }
  .wrap{width:100%;max-width:680px}
  .hero{text-align:center;margin-bottom:34px}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:.5px;color:var(--accent);
    background:var(--accent-soft);border:1px solid #d5e3ff;
    padding:4px 12px;border-radius:20px;margin-bottom:16px;
  }
  .hero h1{margin:0 0 8px;font-size:30px;letter-spacing:.3px}
  .hero h1 span{color:var(--accent)}
  .hero p{margin:0;color:var(--ink-soft);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .item{
    display:block;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:20px;box-shadow:var(--shadow);
    text-decoration:none;color:inherit;transition:transform .15s,border-color .15s;
  }
  .item:hover{transform:translateY(-2px);border-color:#bcd0f5}
  .item .icon{
    width:38px;height:38px;border-radius:10px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;color:var(--accent);
    font-size:17px;font-weight:600;margin-bottom:12px;
  }
  .item h2{margin:0 0 4px;font-size:16px}
  .item p{margin:0;font-size:12.5px;color:var(--ink-soft)}
  .item .tag{
    display:inline-block;margin-top:10px;font-size:11px;color:#9aa5b4;
    border:1px solid var(--line);border-radius:6px;padding:1px 7px;
  }
  .footer{text-align:center;margin-top:30px;color:#a5b0c0;font-size:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="badge">● 站点运行中</div>
    <h1>omoshiroi<span>.loc.cc</span></h1>
    <p>个人服务入口 · 持续在线</p>
  </div>

  <div class="grid">
    <a class="item" href="https://status.omoshiroi.loc.cc">
      <div class="icon">M</div>
      <h2>服务监控</h2>
      <p>Uptime Kuma · 可用性监测</p>
      <span class="tag">需服务器</span>
    </a>
    <a class="item" href="https://vault.omoshiroi.loc.cc">
      <div class="icon">V</div>
      <h2>密码库</h2>
      <p>Vaultwarden · 自建密码管理</p>
      <span class="tag">需服务器</span>
    </a>
    <a class="item" href="https://blog.omoshiroi.loc.cc">
      <div class="icon">B</div>
      <h2>博客 / 文档</h2>
      <p>静态站点 · 记录与分享</p>
      <span class="tag">可先上线</span>
    </a>
    <a class="item" href="https://tools.omoshiroi.loc.cc">
      <div class="icon">T</div>
      <h2>工具箱</h2>
      <p>短链 · 常用在线工具</p>
      <span class="tag">可先上线</span>
    </a>
  </div>

  <div class="footer">omoshiroi.loc.cc · 本页为域名保活入口，服务将逐步接入</div>
</div>
</body>
</html>
